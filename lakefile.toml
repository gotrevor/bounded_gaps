name = "bounded_gaps"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["BoundedGaps"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "BoundedGaps"
# Large interpreter stack: the k=200 matchings-witness capstone (`Mk_200_gt_4`) runs
# `native_decide`/`decide` over 215! factorials and ~100-digit coefficients, whose setup
# recurses deep in the interpreter. weakLeanArgs ⇒ not in the trace hash, no full rebuild.
weakLeanArgs = ["--tstack=2000000"]
